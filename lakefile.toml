name = "BV"
version = "0.1.0"
defaultTargets = ["BV", "Challenge", "Solution"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "BV"

# Comparator (https://github.com/leanprover/comparator) modules, see `comparator.json`.
# `Challenge` is the trusted statement (Mathlib-only imports); `Solution` proves it from `BV`.
[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.35.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert.git"
rev = "v4.35.0"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "127b50e33f6033e2147921167a117af96d9ba4ea"

