name = "BV"
version = "0.1.0"
defaultTargets = ["BV", "LargeSieve"]

[leanOptions]
autoImplicit = false

[[lean_lib]]
name = "BV"

[[lean_lib]]
name = "LargeSieve"

[[require]]
name = "LeanArchitect"
git = "https://github.com/hanwenzhu/LeanArchitect.git"
rev = "v4.32.0-rc1"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.2"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[require]]
name = "leancert"
git = "https://github.com/alerad/leancert"
rev = "v4.32.2.2"

[[require]]
name = "PrimeNumberTheoremAnd"
git = "https://github.com/AlexKontorovich/PrimeNumberTheoremAnd.git"
rev = "6ea1a1532f758dd27be222d3314e798cb8a0b61c"


