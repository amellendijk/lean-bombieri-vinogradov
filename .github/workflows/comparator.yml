name: Comparator

# Checks `Solution.lean` against `Challenge.lean` with https://github.com/leanprover/comparator,
# using the theorem and permitted axioms listed in `comparator.json`.
# This fails while the main theorem still contains a `sorry`, so it is run manually.

on:
  workflow_dispatch:

jobs:
  comparator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          path: project

      - name: Checkout comparator
        uses: actions/checkout@v4
        with:
          repository: leanprover/comparator
          path: comparator

      - name: Checkout lean4export (matching lean-toolchain)
        uses: actions/checkout@v4
        with:
          repository: leanprover/lean4export
          ref: v4.32.2
          path: lean4export

      - name: Checkout landrun
        uses: actions/checkout@v4
        with:
          repository: Zouuup/landrun
          path: landrun

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build landrun
        working-directory: landrun
        run: go build -o landrun cmd/landrun/main.go

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build comparator
        working-directory: comparator
        run: lake build comparator

      - name: Build lean4export
        working-directory: lean4export
        run: lake build

      - name: Fetch Mathlib cache
        working-directory: project
        run: lake exe cache get

      - name: Run comparator
        working-directory: project
        run: |
          export PATH="$GITHUB_WORKSPACE/lean4export/.lake/build/bin:$GITHUB_WORKSPACE/landrun:$PATH"
          lake env "$GITHUB_WORKSPACE/comparator/.lake/build/bin/comparator" comparator.json
